<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#026670" />
      <stop offset="50%" stop-color="#028090" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#026670" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle in Deep Teal & Mint Gradient -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="128"
    fill="url(#tealGrad)"
    filter="url(#softGlow)"
  />

  <!-- Subtle Inner Border Highlight -->
  <rect
    x="34"
    y="34"
    width="444"
    height="444"
    rx="126"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-opacity="0.2"
  />

  <!-- Bold Modern Monogram 'R' in Crisp White -->
  <text
    x="50%"
    y="53%"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="280"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-2"
  >R</text>
</svg>

